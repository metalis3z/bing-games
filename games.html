<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>All games | Bing Games</title>
  <meta name="description" content="Every public Bing Games experience on Roblox, with player counts, visits and favorites.">
  <meta name="theme-color" content="#0e0c12">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap"></noscript>
  <link rel="stylesheet" href="assets/site.css">
  <script src="data/games.js" defer></script>
  <script src="assets/site.js" defer></script>
</head>
<body data-page="games">
  <a class="skip" href="#main">Skip to content</a>

  <header class="nav">
    <div class="wrap nav-row">
      <a class="brand" href="index.html" aria-label="Bing Games home">
        <img src="assets/icon.png" alt="" width="46" height="46">
        <b>Bing Games</b>
      </a>
      <button class="menu-btn" type="button" aria-expanded="false" aria-controls="nav-links" aria-label="Open menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <nav class="nav-links" id="nav-links" aria-label="Main">
        <a href="index.html">Home</a>
        <a href="index.html#story">Studio</a>
        <a href="index.html#hangout">Contact</a>
        <a href="games.html" aria-current="page">All games</a>
      </nav>
    </div>
  </header>

  <main id="main">
    <section class="page-top">
      <div class="wrap">
        <h1 class="h2 display">All games</h1>
        <p class="sub"><span data-count>Loading games</span> from Bing Games, straight from Roblox.</p>
        <div class="sortbar" role="group" aria-label="Sort games" hidden>
          <span>Sort by</span>
          <button type="button" data-sort="playing" aria-pressed="true">Playing</button>
          <button type="button" data-sort="visits" aria-pressed="false">Most visited</button>
          <button type="button" data-sort="favorites" aria-pressed="false">Favorites</button>
          <button type="button" data-sort="newest" aria-pressed="false">Newest</button>
        </div>
        <p class="updated" data-updated></p>
      </div>
    </section>
    <section class="block block-tight" style="padding-bottom:104px" aria-label="Game list">
      <div class="wrap">
        <div class="games" data-all>
          <div class="skel" role="status" aria-label="Loading games"></div>
          <div class="skel" aria-hidden="true"></div>
          <div class="skel" aria-hidden="true"></div>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="wrap footer-row">
      <div class="footer-brand"><img src="assets/icon.png" alt="" width="32" height="32"><span>&copy; <span data-year>2026</span> Bing Games. Numbers from Roblox.</span></div>
      <a class="footer-link" href="index.html">Home</a>
    </div>
  </footer>
</body>
</html>
